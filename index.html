<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1 id="title">Stopwatch</h1>
        <p class="subtitle">Track your time with precision</p>
    </div>
    
    <div class="container">
        <div class="timedisplayed" id="time-display">
            00 : 00 : 00 : 000
        </div>
        
        <div class="buttons">
            <button id="start" class="btn btn-primary">Start</button>
            <button id="stop" class="btn btn-secondary">Stop</button>
            <button id="reset" class="btn btn-secondary">Reset</button>
            <button id="save-record" class="btn btn-accent">Record</button>
        </div>
        
        <div class="records-section">
            <h3>Recorded Times</h3>
            <ul id="records-list" class="records-list">
                </ul>
        </div>
    </div>

    <script src="script/script.js"></script>
</body>
</html>
